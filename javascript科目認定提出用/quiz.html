<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
 <link href="./css/script.css" rel="stylesheet">
<title>カーテンが開いてヒーロー表示</title>


</head>
<body>
  <!-- カーテン -->
  <div class="curtains" aria-hidden="true">
    <div class="curtain top"></div>
    <div class="curtain bottom"></div>
  </div>

  <!-- ヒーロー -->
  <section class="hero" id="hero">
    <div>
      <div class="logo">DIAMOND CHANDELIER</div>
      <p class="subtitle">Gorgeous &amp; Realistic</p>
    </div>

    <!-- ▼ 同期トグル（任意） -->
    
    <!-- タイトル直下のフレーム群 -->
    <div class="frame-container" aria-live="polite">
      <div class="frames">
        <!-- 枠①：Information -->
        <div class="frame" role="region" aria-label="説明の枠 1" data-frame-id="f1">
          <div class="frame__header">
            <span class="dot red"    role="button" tabindex="0" aria-label="背景を赤系に"    data-color="red"></span>
            <span class="dot yellow" role="button" tabindex="0" aria-label="背景を黄系に"    data-color="yellow"></span>
            <span class="dot green"  role="button" tabindex="0" aria-label="背景を緑系に"    data-color="green"></span>
            <span>Information</span>
          </div>
          <div class="frame__body">
            <!-- 初期（default）コンテンツ -->
            <h3 class="frame__title">きらめくシャンデリアの世界へ</h3>
            <p>
              こちらはデモの説明ボックス（1つ目）です。カーテンが開いたあと、タイトル直下に表示されます。
              長い文章はこの枠の中だけがスクロールされます。
            </p>
            <p class="frame__note">※ 左の丸ボタンで、この枠の背景色＆内容を切り替えられます。</p>

            <!-- Google Map：レスポンシブ -->
            <iframe class="map-embed"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d25920.28660394833!2d139.4147328!3d35.700736!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6018e10cb348dded%3A0x72b9f50bf857619b!2zSUtFQeeri-W3nQ!5e0!3m2!1sja!2sjp!4v1771201573042!5m2!1sja!2sjp"
              allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>
        </div>

        <!-- 枠②：Notes -->
        <div class="frame" role="region" aria-label="説明の枠 2" data-frame-id="f2">
          <div class="frame__header">
            <span class="dot red"    role="button" tabindex="0" aria-label="背景を赤系に"    data-color="red"></span>
            <span class="dot yellow" role="button" tabindex="0" aria-label="背景を黄系に"    data-color="yellow"></span>
            <span class="dot green"  role="button" tabindex="0" aria-label="背景を緑系に"    data-color="green"></span>
            <span>Notes</span>
          </div>
          <div class="frame__body">
            <h3 class="frame__title">ご案内</h3>
            <p>こちらは2つ目の枠です。各枠は互いに独立して色と内容を変更できます。</p>
            <p class="frame__note">※ <code>data-frame-id</code> ごとに保存・復元できます。</p>
          </div>
        </div>
      </div><!-- /.frames -->
    </div><!-- /.frame-container -->
  </section>



  <!-- ===== スクリプト：カーテン＆色＋内容の同時切替 ===== -->
<script src="./javascript/script.js"></script>
</body>
</html>
